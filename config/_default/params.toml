colorScheme = "fire"
defaultAppearance = "dark"
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = true
defaultBackgroundImage = "img/background.png"
# Share image for pages without their own featured image (1200x630)
defaultSocialImage = "img/social.jpg"
copyright = "© { year } chilichip. Open source hardware and software."
# Serve images as they are. Blowfish upscales the 256 px game GIFs to 1200 px,
# which makes 27 MB files (Cloudflare Pages rejects files over 25 MiB).
disableImageOptimization = true
mainSections = [
  "posts",
  "docs",
  "games"
]

[header]
layout = "fixed"

[footer]
showCopyright = true
showThemeAttribution = false
showAppearanceSwitcher = true
showScrollToTop = true

# The landing page is our own layout: layouts/partials/home/custom.html,
# with its copy in the front matter of content/_index.md.
[homepage]
layout = "custom"
showRecent = false
showRecentItems = 9
showMoreLink = false
showMoreLinkDest = "/posts"
cardView = true
cardViewScreenWidth = false
layoutBackgroundBlur = false

[article]
showDate = true
showDateUpdated = false
showAuthor = true
showHero = true
heroStyle = "thumbAndBackground"
layoutBackgroundHeaderSpace = false
showRelatedContent = true
relatedContentLimit = 3
showBreadcrumbs = true
showDraftLabel = true
showEdit = false
editAppendPath = true
seriesOpened = false
showHeadingAnchors = true
showPagination = true
invertPagination = false
showReadingTime = true
showTableOfContents = true
showTaxonomies = false
showAuthorsBadges = true
showWordCount = true
showSummary = true
showZenMode = true
sharingLinks = [
  "linkedin",
  "twitter",
  "whatsapp",
  "pinterest",
  "reddit",
  "facebook",
  "email"
]

[list]
showBreadcrumbs = true
showSummary = true
showTableOfContents = false
showCards = false
groupByYear = true
cardView = true
cardViewScreenWidth = false
showHero = true
heroStyle = "background"
layoutBackgroundHeaderSpace = false

[sitemap]
excludedKinds = [ ]

[taxonomy]
showTermCount = true
