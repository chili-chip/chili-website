# Build the Hugo site, then deploy it to Cloudflare Pages with Direct Upload
# (https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/).
#
#   push to main     -> chili-website production (https://chilichip.eu)
#   pull request     -> chili-website preview for the PR branch (link in the PR's deployments)
#
# The Cloudflare deploy is skipped until the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist.
name: Build and deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request or for main; a pull request never cancels a main deploy
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hugo setup
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 0.164.0
          extended: true

      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      # Previews use root-relative links, so they work on the preview hostname
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo -d ./public --baseURL "${{ github.event_name == 'pull_request' && '/' || 'https://chilichip.eu' }}"

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public/
          retention-days: 30

  deploy-cloudflare:
    needs: build
    # Fork PRs get no secrets, so only deploy main and same-repo PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Cloudflare secrets are not set; skipping the Cloudflare deploy."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=chili-website --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
